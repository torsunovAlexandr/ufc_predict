; ---------------------------------------------------------------------------
; Xdebug 3
;
; Режим задаётся переменной окружения XDEBUG_MODE из docker-compose.yml —
; она имеет приоритет над значением ниже. По умолчанию отладчик выключен,
; чтобы не замедлять обычную работу; включается командой `make debug-on`.
; ---------------------------------------------------------------------------

xdebug.mode = off

; Куда Xdebug подключается, когда начинает сессию отладки.
; host.docker.internal — это машина разработчика с точки зрения контейнера.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; Отладка стартует только по триггеру: переменная XDEBUG_TRIGGER или
; XDEBUG_SESSION в cookie, GET, POST либо в окружении. Без этого каждый
; запрос пытался бы достучаться до IDE, даже когда она не слушает.
xdebug.start_with_request = trigger

xdebug.idekey = PHPSTORM

; Не подменять client_host адресом источника запроса: в Docker это обычно
; адрес шлюза сети, а не машина, где запущена IDE.
xdebug.discover_client_host = false

; Лог пишется только при ошибках соединения — первое место, куда смотреть,
; если точка останова не срабатывает.
xdebug.log = /var/www/backend/storage/logs/xdebug.log
xdebug.log_level = 0

; Более информативные var_dump и трассировки
xdebug.var_display_max_depth = 5
xdebug.var_display_max_children = 128
xdebug.var_display_max_data = 1024

; Laravel с его контейнером даёт глубокий стек вызовов
xdebug.max_nesting_level = 512

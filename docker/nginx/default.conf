server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 20M;

    # Собранный фронтенд (Vue + Vite)
    root /var/www/frontend;
    index index.html;

    # API отдаёт Laravel
    location /api {
        try_files $uri @backend;
    }

    location = /up {
        try_files $uri @backend;
    }

    location @backend {
        root /var/www/backend/public;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 120;
    }

    # SPA: любой неизвестный путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}

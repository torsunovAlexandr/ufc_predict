name: contract

# Живые контракты с внешними источниками.
#
# На этапе 0 это заглушка: она только проверяет, что источники вообще
# отвечают, и ровно в той мере, в какой их видно из GitHub Actions
# (см. комментарий к первому шагу про 403 от ufc.com). Настоящее содержание появится на этапах 3 и 4 — там сборка будет
# сверять разметку ufc.com и формат ответа The Odds API с фикстурами,
# на которых написаны тесты.
#
# Смысл отдельной сборки по расписанию в том, что внешний мир меняется без
# нашего участия. Дефекты №10, №11 и №12 первой версии — это все три ровно
# «формат внешних данных оказался не таким, как предполагалось». Пусть об
# этом сообщает расписание, а не пустой экран накануне турнира.

on:
  schedule:
    # Каждый день в 06:00 UTC — 11:00 по Екатеринбургу.
    - cron: '0 6 * * *'
  workflow_dispatch:
  # Проверка внешнего мира не должна дёргать ufc.com на каждый посторонний
  # pull request — но сама эта сборка обязана быть проверена тогда, когда её
  # правят. Отсюда фильтр по пути: запуск только если изменился этот файл.
  pull_request:
    paths:
      - '.github/workflows/contract.yml'

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Адрес расписания на ufc.com жив
        # ufc.com отвечает 403 на запросы с адресов датацентров — проверено
        # из двух разных облаков, браузерный User-Agent не помогает. Парсер
        # этапа 3 работает не отсюда, а с машины разработчика, где адрес
        # домашний, поэтому 403 здесь ничего не говорит о парсере.
        #
        # Значит, отсюда проверяется ровно то, что отсюда видно: имя
        # резолвится, TLS встаёт, сервер отвечает. Что страница реально
        # отдаётся — проверяет `make doctor` там, где потом пойдёт парсер.
        run: |
          code=$(curl -s -o /tmp/events.html -w '%{http_code}' -A 'ufc-predict-contract-check' \
                 --max-time 30 https://www.ufc.com/events || echo 000)
          echo "HTTP $code, получено $(wc -c < /tmp/events.html) байт"
          case "$code" in
            200)
              echo "Страница отдалась целиком — этот адрес в CI не отсекается." ;;
            403)
              echo "403: адреса датацентров отсекаются, это ожидаемо. Сам адрес жив." ;;
            *)
              echo "::error::ufc.com/events ответил $code — ожидались 200 или 403. Адрес расписания изменился либо сайт лежит."
              exit 1 ;;
          esac

      - name: The Odds API отвечает
        # Без ключа сервис отвечает 401 — этого достаточно, чтобы понять,
        # что адрес жив и формат ошибок не изменился. Настоящий запрос
        # с ключом появится на этапе 4.
        run: |
          code=$(curl -s -o /tmp/odds.json -w '%{http_code}' --max-time 30 \
                 'https://api.the-odds-api.com/v4/sports/mma_mixed_martial_arts/odds/?regions=eu' || echo 000)
          echo "HTTP $code"
          case "$code" in
            200|401) echo "Адрес жив" ;;
            *)
              echo "::error::api.the-odds-api.com ответил $code — ожидались 200 или 401."
              cat /tmp/odds.json
              exit 1
              ;;
          esac

      - name: Ключ ODDS_API_KEY читается и не утекает в логи
        # На этапе 0 ключа в Secrets ещё нет — это нормально, проверяем только
        # механику: если ключ задан, он подставляется и маскируется звёздочками.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "ODDS_API_KEY в Secrets не задан — так и задумано до этапа 4."
            exit 0
          fi
          echo "ODDS_API_KEY задан, длина ${#ODDS_API_KEY} символов."
          echo "Проверка маскирования (значение ниже должно быть звёздочками): $ODDS_API_KEY"
